<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>TO-DO List</title>
</head>

<body>


    <div class="flex-container">
        <div class="item">
            <h2>Панель управления</h2>
            <br>
            <form>
                <input id="div1-addTask" type="text" placeholder="Опишите задачу">
                <button id="btAddTask" type="button">Добавить</button>
                <script>

                    let GLOBAL_STORAGE_PREFIX_ID = localStorage.getItem("GLOBAL_STORAGE_PREFIX_ID");
                    if (!GLOBAL_STORAGE_PREFIX_ID) {
                        GLOBAL_STORAGE_PREFIX_ID = 0;
                        localStorage.setItem("GLOBAL_STORAGE_PREFIX_ID", GLOBAL_STORAGE_PREFIX_ID);
                    }

                    function updateTaskListInSrorage(taskContent) {

                        GLOBAL_STORAGE_PREFIX_ID++;
                        localStorage.setItem("GLOBAL_STORAGE_PREFIX_ID", GLOBAL_STORAGE_PREFIX_ID);

                        idKey = 'key' + String(GLOBAL_STORAGE_PREFIX_ID);

                        const newTaskObj = getTaskObject(taskContent, idKey);
                        localStorage.setItem(idKey, JSON.stringify(newTaskObj));

                        return idKey;
                    };

                    function deleteButtonAndParagraphOnForm(idTask) {

                        const pFormEl = document.querySelector('#group' + idTask);
                        pFormEl.remove();
                    };

                    function markTaskOnForm(idTask, isComplete) {
                        const spanFormEl = document.querySelector('#paragraph' + idTask);
                        spanFormEl.style.textDecoration = isComplete ? 'line-through' : 'none';
                    };

                    function updateButtonAndParagraphOnForm(idKey, formEl) {

                        objTask = {};
                        try {
                            const rawData = localStorage.getItem(idKey);
                            objTask = JSON.parse(rawData);
                        } catch (e) {
                            console.warn("Отсутствуют данные в локальном хранилище, невозможно получить задачу по ИД=" + idKey, e);
                            return false;
                        };


                        const findResult = idKey.match(/\d+$/);
                        const idTask = findResult[0];

                        const groupDiv = document.createElement('div');
                        groupDiv.id = "group" + idTask;
                        formEl.append(groupDiv);

                        const chBox = addCheckboxToElement(groupDiv, idTask, objTask.isComplete, (e) => {

                            const activeChk = e.currentTarget;
                            let checkID = undefined;
                            if (activeChk) {
                                checkID = activeChk.id;
                            } else return false;

                            const findResult = checkID.match(/\d+$/);
                            const idTask = findResult[0];

                            const idKey = 'key' + idTask;
                            //зачеркнуть текст , пометить задачу в хранилище
                            const isComplete = changeTaskByIndexOnStorage(idKey);
                            markTaskOnForm(idTask, isComplete);

                            //сбросим фильтр на умолчание = Все задачи
                            const defaultRadio = document.querySelector('input[name="taskFilter"][value="allTasks"]');
                            if (defaultRadio) {
                                defaultRadio.checked = true;
                            }

                            doFilterTaskListInStorage(defaultRadio.value);



                        });

                        const paragraph = addParagraphToElement(groupDiv, idTask, objTask.description);


                        addButtonDeleteToElement(paragraph, idTask, (e) => {

                            const activeBt = e.currentTarget;
                            let buttonID = undefined;
                            if (activeBt) {
                                buttonID = activeBt.id;
                            } else return false;

                            const findResult = buttonID.match(/\d+$/);
                            const idTask = findResult[0];

                            const idKey = 'key' + idTask;
                            deleteTaskByIndexOnStorage(idKey);
                            deleteButtonAndParagraphOnForm(idTask);

                        });

                        markTaskOnForm(idTask, objTask.isComplete);

                    };

                    function addCheckboxToElement(groupDiv, idTask, isComplete, fc) {
                        chBox = document.createElement('input');
                        chBox.type = 'checkbox';
                        chBox.id = "checkbox" + idTask;
                        chBox.checked = isComplete;
                        chBox.addEventListener('change', fc);
                        groupDiv.append(chBox);
                        return chBox;

                    };

                    function addParagraphToElement(formEl, idTask, descriptionTask) {

                        const paragraph = document.createElement('span');
                        paragraph.textContent = descriptionTask;
                        paragraph.className = 'task-description';
                        paragraph.id = "paragraph" + idTask;
                        formEl.append(paragraph);


                        return paragraph;

                    }

                    function addButtonDeleteToElement(formEl, suffix, fc) {
                        const btDelete = document.createElement('button');
                        btDelete.textContent = "Удалить";
                        btDelete.type = 'button';
                        btDelete.id = 'delete' + suffix;
                        btDelete.addEventListener('click', fc);

                        /*const img = document.createElement('img');
                        img.src = 'icons/delete.svg'; 
                        img.style.width = '16px';
                        img.style.height = '16px';
                        img.style.verticalAlign = 'middle';
                        img.style.marginRight = '6px';
                        btDelete.append(img);*/

                        formEl.append(btDelete);

                        return btDelete;
                    };

                    function getTaskObject(description, id) {

                        const taskObj = {
                            id,
                            description,
                            isComplete: false,
                            filtered: true
                        };

                        return taskObj;
                    };

                    function deleteTaskByIndexOnStorage(idKey) {
                        localStorage.removeItem(idKey);
                    }

                    function changeTaskByIndexOnStorage(idKey) {

                        objTask = {};
                        try {
                            const rawData = localStorage.getItem(idKey);
                            objTask = JSON.parse(rawData);
                        } catch (e) {
                            console.warn("Отсутствуют данные в локальном хранилище, невозможно получить задачу по ИД=" + idKey, e);
                            return false;
                        };

                        objTask.isComplete = !objTask.isComplete;
                        localStorage.setItem(idKey, JSON.stringify(objTask));
                        return objTask.isComplete;

                    }


                    function doFilterTaskListInStorage(filterName) {

                        const storageSize = localStorage.length;
                        for (i = 0; i < storageSize; i++) {

                            idKey = localStorage.key(i);

                            if (idKey === "GLOBAL_STORAGE_PREFIX_ID") {
                                continue;
                            }

                            let rawData = localStorage.getItem(idKey);

                            if (!rawData) {
                                continue;
                            };

                            objTask = {};
                            try {
                                const rawData = localStorage.getItem(idKey);
                                objTask = JSON.parse(rawData);
                            } catch (e) {
                                console.warn("Отсутствуют данные в локальном хранилище, невозможно получить задачу по ИД=" + idKey, e);
                                return false;
                            };

                            switch (filterName) {
                                case 'allTasks':
                                    objTask.filtered = true;
                                    break;

                                case 'onlyActive':
                                    if (!objTask.isComplete) {
                                        objTask.filtered = true;
                                    } else {
                                        objTask.filtered = false;
                                    }
                                    break;

                                case 'completed':
                                    if (objTask.isComplete) {
                                        objTask.filtered = true;
                                    } else {
                                        objTask.filtered = false;
                                    }

                                    break;
                                default:
                                    objTask.filtered = true;
                                    break;
                            }

                            localStorage.setItem(idKey, JSON.stringify(objTask));

                        }

                    }


                    const addTaskClick = function () {

                        const div1AddTask = document.querySelector("#div1-addTask");
                        const div2TaskList = document.querySelector("#div2-taskList");

                        idKey = updateTaskListInSrorage(div1AddTask.value);

                        updateButtonAndParagraphOnForm(idKey, div2TaskList);

                        //сбросим фильтр на умолчание = Все задачи
                        const defaultRadio = document.querySelector('input[name="taskFilter"][value="allTasks"]');
                        if (defaultRadio) {
                            defaultRadio.checked = true;
                        }

                        doFilterTaskListInStorage(defaultRadio.value);

                        div1AddTask.value = "";
                    };

                    const btAddTask = document.querySelector("#btAddTask");
                    btAddTask.addEventListener('click', addTaskClick);



                </script>
            </form>
        </div>

        <div class="item">
            <h2>Список задач</h2>
            <form>
                <div id="div2-taskList">
                    <script>

                        function initTaskListInStorage(idKey) {

                            objTask = {};
                            try {
                                const rawData = localStorage.getItem(idKey);
                                objTask = JSON.parse(rawData);
                            } catch (e) {
                                console.warn("Отсутствуют данные в локальном хранилище, невозможно получить задачу по ИД=" + idKey, e);
                                return false;
                            };

                            objTask.filtered = true; //так как по умолчанию выбран фильтр "Все задачи"

                            localStorage.setItem(idKey, JSON.stringify(objTask));

                            return idKey;
                        };


                        function readFromSorage() {

                            const div2TaskList = document.querySelector("#div2-taskList");


                            const storageSize = localStorage.length;

                            for (i = 0; i < storageSize; i++) {
                                const idKey = localStorage.key(i);

                                if (idKey === "GLOBAL_STORAGE_PREFIX_ID") {
                                    continue;
                                }

                                let item = localStorage.getItem(idKey);

                                if (!item) {
                                    continue;
                                };
                                const objTask = JSON.parse(item);

                                initTaskListInStorage(idKey);

                                updateButtonAndParagraphOnForm(idKey, div2TaskList);

                            }

                        };

                        readFromSorage();


                    </script>


                </div>
            </form>

        </div>

        <div class="item item-narrow">
            <h2>Блок фильтрации</h2>

            <form>
                <div id="div3-taskFilter">
                    <label>
                        <input type="radio" name="taskFilter" value="allTasks" checked>Все задачи
                    </label>
                    <br>

                    <label>
                        <input type="radio" name="taskFilter" value="onlyActive">Только активные
                    </label>
                    <br>

                    <label>
                        <input type="radio" name="taskFilter" value="completed">Выполненные
                    </label>


                </div>



                <div>
                    <br>
                    <label>
                        <input id="searchfield" type="text" placeholder="Поиск">
                    </label>



                </div>


                <script>

                    function getTaskObjectFromStorageByKey(idKey) {

                        objTask = {};
                        try {
                            const rawData = localStorage.getItem(idKey);
                            objTask = JSON.parse(rawData);
                        } catch (e) {
                            console.warn("Отсутствуют данные в локальном хранилище, невозможно получить задачу по ИД=" + idKey, e);
                            return null;
                        };

                        return objTask;

                    }

                    function doFilterTaskListOnForm(parent) {

                        //const parent = document.querySelector('#div2-taskList');
                        const children = parent.querySelectorAll('*');

                        const delCandidate = []; //DOM-element

                        for (const item of children) {
                            itemId = item.id;

                            if (!itemId) {
                                continue;
                            }

                            const nonNumericPart = itemId.replace(/\d+$/, '');
                            if (nonNumericPart !== 'group') {
                                continue;
                            }

                            delCandidate.push(item);

                        }
                        delCandidate.forEach(el => el.remove());


                        const storageSize = localStorage.length;
                        for (i = 0; i < storageSize; i++) {

                            idKey = localStorage.key(i);

                            if (idKey === "GLOBAL_STORAGE_PREFIX_ID") {
                                continue;
                            }

                            let rawData = localStorage.getItem(idKey);

                            if (!rawData) {
                                continue;
                            };

                            objTask = {};
                            try {
                                const rawData = localStorage.getItem(idKey);
                                objTask = JSON.parse(rawData);
                            } catch (e) {
                                console.warn("Отсутствуют данные в локальном хранилище, невозможно получить задачу по ИД=" + idKey, e);
                                return false;
                            }

                            if (objTask.filtered) {
                                updateButtonAndParagraphOnForm(idKey, parent);
                            }

                        }

                    }




                    filterContainer = document.getElementById('div3-taskFilter');
                    filterContainer.addEventListener('change', (e) => {
                        const target = e.target;
                        if (target.matches('input[name="taskFilter"]')) {

                            const selectedRadio = document.querySelector('input[name="taskFilter"]:checked');
                            const div2TaskList = document.querySelector("#div2-taskList");

                            const btAddTask = document.querySelector("#btAddTask");
                            if (!btAddTask) {
                                return false;
                            }


                            if (selectedRadio.value === "allTasks") {
                                //кнопка Добавить Активная
                                btAddTask.disabled = false;
                            } else {
                                //кнопка добавить недоступная
                                btAddTask.disabled = true;
                            }

                            doFilterTaskListInStorage(selectedRadio.value);
                            doFilterTaskListOnForm(div2TaskList);

                        }
                    });

                    function doSearchFromStorage(searchValue) {

                        const storageSize = localStorage.length;
                        for (i = 0; i < storageSize; i++) {
                            idKey = localStorage.key(i);

                            if (idKey === "GLOBAL_STORAGE_PREFIX_ID") {
                                continue;
                            }

                            let item = localStorage.getItem(idKey);

                            if (!item) {
                                continue;
                            };
                            objTask = JSON.parse(item);


                            const isMatch = objTask.description.toLowerCase().includes(searchValue.toLowerCase());

                            if (isMatch) {

                                if (searchValue.length === objTask.description.length) {
                                    const findResult = idKey.match(/\d+$/);
                                    const idTask = findResult[0];

                                    return document.querySelector("#paragraph" + idTask);

                                } else {
                                    return null;

                                }

                            }

                        }

                        return null;


                    }

                    function cleanPreviousHighlighting(){

                        const parent = document.querySelector("#div2-taskList");
                        const children = parent.querySelectorAll('*');

                        
                        for (const item of children) {
                            itemId = item.id;

                            if (!itemId) {
                                continue;
                            }

                            const nonNumericPart = itemId.replace(/\d+$/, '');
                            if (nonNumericPart !== 'paragraph') {
                                continue;
                            }

                            item.style.background = '';

                        }


                        
                    }

                    const searchInput = document.querySelector("#searchfield");
                    searchInput.addEventListener('input', (e) => {

                        const searchValue = e.target.value;



                        cleanPreviousHighlighting();

                        const p = doSearchFromStorage(searchValue);


                        if ((!searchValue) || (!p)) {
                            p.style.background = '';
                            return false;
                        }

                        if (p.style.background !== 'yellow') {
                            p.style.background = 'yellow';

                        }
                    })

                </script>


            </form>

        </div>
    </div>

    <style>
        .flex-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 10px;
        }

        .item {
            flex: 1 1 auto;
            border: 2px solid black;
            height: 500px;
            padding: 15px;
            box-sizing: border-box;
        }

        .item-narrow {
            width: 300px;
            flex: none;
            min-width: 200px;
        }

        /* Подчёркивание заголовков */
        .item h2 {
            color: blue;
            border-bottom: 4px solid black;
            /* толстая линия снизу */
            padding-bottom: 8px;
            /* отступ между текстом и линией */
            margin: 0 0 15px 0;
            /* сброс стандартных отступов h2, снизу — отступ до контента */
        }
    </style>

</body>

</html>
