<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>TO-DO List</title>
</head>

<body>


    <div class="flex-container">
        <div class="item">
            <h2>Панель управления</h2>
            <br>
            <form>
                <input id="div1-addTask" type="text" placeholder="Опишите задачу">
                <button id="btAddTask" type="button">Добавить</button>
                <script>
                    function updateTaskListInSrorage(taskContent) {

                        const rawData = localStorage.getItem('currentTaskList');
                        let currentTaskList = [];
                        if (rawData !== null) {
                            try {
                                currentTaskList = JSON.parse(rawData);
                            } catch (e) {
                                console.error("Некорректные данные в LocalStorage: currentTaskList.", e);
                                currentTaskList = [];
                            }
                        };

//console.log("Длина массива данных: "+currentTaskList.length);                        

                        let newTaskObj = getTaskObject(taskContent, currentTaskList.length);
                        suffix = currentTaskList.push(newTaskObj);
                        localStorage.setItem('currentTaskList', JSON.stringify(currentTaskList));

                        return suffix;
                    };

                    function addButtonDeleteToElement(element, suffix, fc) {
                        const btDelete = document.createElement('button');
                        btDelete.textContent = "Удалить";
                        btDelete.type='button';
                        btDelete.id = 'delete' + suffix;
//console.log("Добавлена кнопка "+btDelete.textContent+" id="+btDelete.id);                        
                        btDelete.addEventListener('click', fc);
                        element.append(btDelete);
                    };

                    function getTaskObject(description, id){
//console.log("Добавлен объект, ИД = "+id);                        
                        
                        const taskObj = {
                            id,
                            description,
                            isComplete: false
                        };
                     
                        return taskObj;
                    };

                    function renderTaskListOnSite(div2TaskList) {

                        const rawData = localStorage.getItem('currentTaskList');
                        let currentTaskList = [];

                        if (rawData !== null) {
                            try {
                                currentTaskList = JSON.parse(rawData);
                            } catch (e) {
                                console.error("Некорректные данные в LocalStorage: currentTaskList.", e);
                                currentTaskList = [];
                            }
                        };


                        while (div2TaskList.firstChild) {
                            div2TaskList.removeChild(div2TaskList.firstChild);
                        };

                        currentTaskList.forEach(element => {
                            const newTask = document.createElement('p');
                            newTask.textContent = element.description;
                            div2TaskList.append(newTask);

                            addButtonDeleteToElement(newTask, element.id, (e) => {
                               
                                const activeBt = e.currentTarget;
                                let buttonID = undefined;
                                if (activeBt) {
                                    console.log('Нажатая кнопка:', activeBt.id);
                                    buttonID = activeBt.id;
                                } else return false;

                                const idxTask = buttonID.match(/\d+$/); 
console.log("idxTask="+idxTask);
                                
                                deleteTaskByIndexOnStorage(idxTask);
                                



 
                            });
                        });

                    };

                    function deleteTaskByIndexOnStorage(idxTask){

                        const rawData = localStorage.getItem('currentTaskList');
                        let currentTaskList = [];
                        if (rawData !== null) {
                            try {
                                currentTaskList = JSON.parse(rawData);
                            } catch (e) {
                                console.error("Некорректные данные в LocalStorage: currentTaskList.", e);
                                currentTaskList = [];
                            }
                        };
console.log("обработка индекса "+idxTask);
                        const deleteID = currentTaskList.findIndex(task => task.id==idxTask);
console.log("найден индекс значения хранилища "+deleteID);                        
                        currentTaskList.splice(deleteID, 1);

                    }

                    const addTaskClick = function () {

                        const div1AddTask = document.querySelector("#div1-addTask");
                        const div2TaskList = document.querySelector("#div2-taskList");

                        const newTask = document.createElement('p');
                        newTask.textContent = div1AddTask.value;
 //console.log("добавили параграф: "+div1AddTask.value);                           
                        let suffix = updateTaskListInSrorage(div1AddTask.value);
                        div1AddTask.value = "";

                        renderTaskListOnSite(div2TaskList, suffix);

                    };
                    
                    const btAddTask = document.querySelector("#btAddTask");
                    btAddTask.addEventListener('click', addTaskClick);
                </script>
            </form>
        </div>

        <div class="item">
            <h2>Список задач</h2>
            <form>
                <div id="div2-taskList">


                </div>
            </form>

        </div>

        <div class="item item-narrow">
            <h2>Блок фильтрации</h2>
        </div>
    </div>

    <style>
        .flex-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 10px;
        }

        .item {
            flex: 1 1 auto;
            border: 2px solid black;
            height: 500px;
            padding: 15px;
            box-sizing: border-box;
        }

        .item-narrow {
            width: 200px;
            flex: none;
            min-width: 200px;
        }

        /* Подчёркивание заголовков */
        .item h2 {
            color: blue;
            border-bottom: 4px solid black;
            /* толстая линия снизу */
            padding-bottom: 8px;
            /* отступ между текстом и линией */
            margin: 0 0 15px 0;
            /* сброс стандартных отступов h2, снизу — отступ до контента */
        }
    </style>

</body>

</html>
